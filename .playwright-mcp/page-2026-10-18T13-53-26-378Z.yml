                  - paragraph [ref=f108e1267]: The iPhone 17 has a USB-C charging port, since the Lightning cable was phased out with the discontinuation of the iPhone 14 models in 2025. With all iPhone purchases, an Apple-certified charging cable is included in the box, but not a wall plug. This is to help Apple reach carbon neutrality by 2030.
                  - paragraph [ref=f108e1268]:
                    - text: You can also use a Magsafe wireless charger to power your iPhone 17, but you’ll need to buy one separately. Check out our range of
                    - link "wireless chargers" [ref=f108e1269] [cursor=pointer]:
                      - /url: https://accessories.vodafone.co.uk/collections/wireless-charging
            - generic [ref=f108e1272]:
              - button "Does the iPhone 17 support eSIM?" [ref=f108e1273] [cursor=pointer]
              - generic [ref=f108e1283]:
                - separator [ref=f108e1284]
                - generic [ref=f108e1285]:
                  - paragraph [ref=f108e1286]: Yes, the iPhone 17 is compatible with eSIM functionality. Using an eSIM allows you to have a digital, built-in version of your SIM card, which is beneficial for a few reasons. These include the reduction of plastic waste, and the fact that there’s no chance of losing your SIM.
                  - paragraph [ref=f108e1287]: The iPhone 17’s dual SIM capabilities mean that you can have two eSIMs active in the same phone. This is great for accessing different SIM plans while travelling abroad, for example.
            - generic [ref=f108e1290]:
              - button "Can I use a physical SIM for the iPhone 17?" [ref=f108e1291] [cursor=pointer]
              - generic [ref=f108e1301]:
                - separator [ref=f108e1302]
                - generic [ref=f108e1303]:
                  - paragraph [ref=f108e1304]: Yes, the iPhone 17 does have a physical SIM card slot (for nano-SIM) as well as built-in eSIM functionality. The iPhone Air, which was released alongside the iPhone 17, was the first eSIM-only iPhone.
                  - paragraph [ref=f108e1305]: All iPhone 17 models have dual SIM capabilities, meaning you can have two active SIMs, one physical and one eSIM, in the phone. This allows you to easily switch between profiles, which is ideal when travelling abroad or needing to access a different data package.
            - generic [ref=f108e1308]:
              - button "What chip does the iPhone 17 have?" [ref=f108e1309] [cursor=pointer]
              - generic [ref=f108e1319]:
                - separator [ref=f108e1320]
                - paragraph [ref=f108e1322]: Apple iPhone 17 includes the A19 chip with 5-core GPU, which is an upgrade on the iPhone 16’s A18 chip, with improved performance for demanding tasks and gaming, superior on-device AI capabilities, and improved battery life, setting new standards for mobile processing and energy efficiency.
            - generic [ref=f108e1325]:
              - button "What’s the display of the Apple iPhone 17 like?" [ref=f108e1326] [cursor=pointer]
              - generic [ref=f108e1336]:
                - separator [ref=f108e1337]
                - paragraph [ref=f108e1339]: The iPhone 17 has a 6.3-inch Super Retina XDR display. It’s also an Always-On display with ProMotion technology, offering adaptive refresh rates up to 120Hz. It’s an HDR display and has haptic touch.
            - generic [ref=f108e1342]:
              - button "What’s the camera quality of the iPhone 17?" [ref=f108e1343] [cursor=pointer]
              - generic [ref=f108e1353]:
                - separator [ref=f108e1354]
                - paragraph [ref=f108e1356]: iPhone 17 benefits from an advanced dual-camera system, including a 48MP Dual Fusion camera and a 12MP Fusion Ultra Wide camera. It also has an 18MP Center Stage front camera. Plus, it can shoot video in 4K 60fps.
            - generic [ref=f108e1359]:
              - button "What is the battery life of the iPhone 17 like?" [ref=f108e1360] [cursor=pointer]
              - generic [ref=f108e1370]:
                - separator [ref=f108e1371]
                - paragraph [ref=f108e1373]: With the iPhone 17 you can enjoy up to 30 hours of video playback (up to 27 when streaming video), which is comparatively longer than the battery life of the iPhone Air, iPhone 16 Plus and the iPhone 16 Pro. Please be aware that battery life varies by use and configuration – see Apple’s battery page for more information.
            - generic [ref=f108e1376]:
              - button "Is the Apple iPhone 17 waterproof?" [ref=f108e1377] [cursor=pointer]
              - generic [ref=f108e1387]:
                - separator [ref=f108e1388]
                - paragraph [ref=f108e1390]: Like most modern smartphones, the iPhone 17 is splash and water resistant. It is rated IP68 under the IEC standard 60529, which means the phone can safely withstand being at a maximum depth of six metres below water for up to 30 minutes.
            - generic [ref=f108e1393]:
              - button "What AI features does the iPhone 17 have?" [ref=f108e1394] [cursor=pointer]
              - generic [ref=f108e1404]:
                - separator [ref=f108e1405]
                - paragraph [ref=f108e1407]: The iPhone 17 has Apple Intelligence built-in, featuring helpful tools that make getting things done and expressing yourself easier than ever. These include Live Translation for real-time voice or text translations, Visual Intelligence camera search, Clean Up for photos, Genmoji emoji creation and Writing Tools for structuring messages and emails.
            - generic [ref=f108e1410]:
              - button "What colours does the iPhone 17 come in?" [ref=f108e1411] [cursor=pointer]
              - generic [ref=f108e1421]:
                - separator [ref=f108e1422]
                - paragraph [ref=f108e1424]: The iPhone 17 is available in five vibrant colours that are exclusive to this model. The colourways of the iPhone 17 are black, white, mist blue, sage, and lavender.
            - generic [ref=f108e1427]:
              - button "How much storage does the iPhone 17 have?" [ref=f108e1428] [cursor=pointer]
              - generic [ref=f108e1438]:
                - separator [ref=f108e1439]
                - paragraph [ref=f108e1441]: The iPhone 17 has two storage options, which are 256GB and 512GB.
            - generic [ref=f108e1444]:
              - button "Does the iPhone 17 have the same buttons as other iPhones?" [ref=f108e1445] [cursor=pointer]
              - generic [ref=f108e1455]:
                - separator [ref=f108e1456]
                - paragraph [ref=f108e1458]: The iPhone 17’s design does not include any new buttons. This model still features the Action button, which was originally introduced to the iPhone 15 models in 2023, and the Camera Control button that was a new feature of the iPhone 16 models, launched in 2024.
