        - generic [ref=f42e4068]:
          - heading "We're saying goodbye to 3G and hello to better connections" [level=2] [ref=f42e4069]
          - paragraph [ref=f42e4071]:
            - text: Are you 4G or 5G ready?
            - link "Check if you're compatible and set up for 4G calling" [ref=f42e4072] [cursor=pointer]:
              - /url: https://www.vodafone.co.uk/help/mobile/set-up-4g-calling
      - generic [ref=f42e4074]:
        - generic [ref=f42e4079]:
          - heading "Why choose Vodafone?" [level=2] [ref=f42e4080]
          - generic [ref=f42e4082]:
            - generic [ref=f42e4092]:
              - heading "New Vodafone SuperMobile™ Plans" [level=2] [ref=f42e4093]
              - paragraph [ref=f42e4094]: Stay connected with up to 4x faster speeds than our standard plans, and feel the difference.
            - generic [ref=f42e4103]:
              - heading "The nation's biggest network keeps getting better" [level=2] [ref=f42e4104]
              - paragraph [ref=f42e4105]: With an £11 billion investment, opportunity awaits. Vodafone on the Nation's Network.
            - generic [ref=f42e4114]:
              - heading "Vodafone 5G and 5G+" [level=2] [ref=f42e4115]
              - paragraph [ref=f42e4116]: Enjoy 5G with amazingly fast speeds, plus get even greater coverage and better battery life with 5G+.
            - generic [ref=f42e4125]:
              - heading "Unlimited data plans" [level=2] [ref=f42e4126]
              - paragraph [ref=f42e4127]: Never run out of data - so you can stream, share, listen and browse without restrictions.
        - generic [ref=f42e4131]:
          - heading [level=2]
          - generic [ref=f42e4133]:
            - heading "Unlimited data SIMs" [level=3] [ref=f42e4134]
            - paragraph [ref=f42e4135]: Keep your current device and get access to ultrafast 5G unlimited data, including calls and texts. Just choose one of our Unlimited plans, so you don't need to worry about using all your data.
            - paragraph [ref=f42e4136]: Choose an Unlimited Xtra, Unlimited Plus, or Unlimited Premier plan for unlimited data with no speed restrictions. On these plans you'll always experience the fastest download speeds available. On Unlimited plans, your speed will be capped at 100Mbps.
        - generic [ref=f42e4140]:
          - heading [level=2]
          - generic [ref=f42e4142]:
            - heading "SIMs with roaming" [level=3] [ref=f42e4143]
            - paragraph [ref=f42e4144]:
              - text: We have a range of SIMs that include roaming packages. Choose a plan with European roaming for 52 destinations within Europe, or global roaming for 84 worldwide destinations - perfect for if you travel a lot. You can see which countries are included on our
              - link "roaming abroad page" [ref=f42e4145] [cursor=pointer]:
                - /url: https://www.vodafone.co.uk/mobile/global-roaming
            - paragraph [ref=f42e4146]:
              - text: If you don't choose a SIM with a roaming package, you'll pay a daily fee to use our network abroad, or you can
              - link "buy a bundle to keep costs low" [ref=f42e4147] [cursor=pointer]:
                - /url: https://www.vodafone.co.uk/mobile/extras
        - generic [ref=f42e4151]:
          - heading [level=2]
          - generic [ref=f42e4153]:
            - heading "SIMs with 5G" [level=3] [ref=f42e4154]
            - paragraph [ref=f42e4155]: All our Pay monthly SIM only plans come with 5G as standard. On 5G, you can expect fast speeds across the UK as well as abroad if you roam with us.
            - paragraph [ref=f42e4156]:
              - text: Some SIMs come with 5G+. This is an even faster 5G experience, which is 10 times faster than 4G. Plus, it offers greater coverage across the UK, with a better connection in busy places. It also helps improve your battery life, with up to three hours of improved performance.
              - link "Learn more about 5G+" [ref=f42e4157] [cursor=pointer]:
                - /url: https://www.vodafone.co.uk/network/5g
        - generic [ref=f42e4161]:
          - heading [level=2]
          - generic [ref=f42e4163]:
            - heading "eSIM" [level=3] [ref=f42e4164]
            - paragraph [ref=f42e4165]: When ordering your SIM, you can choose between a physical SIM card or an eSIM which is digital. If you choose an eSIM, you'll need to make sure you have a compatible phone.
            - paragraph [ref=f42e4166]:
              - text: With an eSIM, you'll be able to instantly activate your plan - no need to wait for a physical card to arrive. They also offer built-in security (it can't be stolen or lost) and produce less plastic waste as there's no SIM card or packaging.
              - link "Learn more about eSIMs" [ref=f42e4167] [cursor=pointer]:
                - /url: https://www.vodafone.co.uk/sim-only/esim
